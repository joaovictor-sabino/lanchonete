<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cardápio</title>
    <style>
        body { font-family: Arial, sans-serif; background: #fff8f0; margin: 0; padding: 20px 20px 100px; }
        h1 { text-align: center; color: #b53a00; }
        h2 { color: #b53a00; border-bottom: 2px solid #b53a00; padding-bottom: 4px; }
        .lista { max-width: 800px; margin: 0 auto; }
        .item { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 12px;
                box-shadow: 0 2px 6px rgba(0,0,0,.1); display: flex;
                justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
        .nome { font-weight: bold; font-size: 18px; }
        .desc { color: #666; margin-top: 4px; }
        .preco { color: #b53a00; font-weight: bold; font-size: 18px; margin-top: 4px; }
        .qtd { display: flex; align-items: center; gap: 6px; }
        .qtd button { width: 36px; height: 36px; border: 0; border-radius: 6px; background: #b53a00;
                      color: #fff; font-size: 20px; cursor: pointer; }
        .qtd input { width: 50px; padding: 6px; font-size: 16px; text-align: center; }
        .barra { position: fixed; bottom: 0; left: 0; right: 0; background: #fff;
                 box-shadow: 0 -2px 8px rgba(0,0,0,.15); padding: 12px; text-align: center; }
        .barra button { background: #b53a00; color: #fff; border: 0; padding: 12px 24px;
                        border-radius: 8px; font-size: 18px; cursor: pointer; }
        .carrinho { position: fixed; top: 16px; right: 16px; background: #b53a00; color: #fff;
                    padding: 10px 16px; border-radius: 20px; text-decoration: none; font-weight: bold; }
        .vazio { color: #999; font-style: italic; }
        html { scroll-behavior: smooth; }
        .categorias { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin: 0 auto 24px; max-width: 800px; }
        .categorias a { background: #fff; color: #b53a00; border: 2px solid #b53a00; padding: 8px 16px;
                        border-radius: 20px; text-decoration: none; font-weight: bold; }
        .categorias a:hover { background: #b53a00; color: #fff; }
        h2 { margin-top: 32px; }
    </style>
</head>
<body>
    <a class="carrinho" th:href="@{/carrinho}">🛒 Carrinho (<span th:text="${totalItens}">0</span>)</a>

    <h1>🍔 Nosso Cardápio</h1>
    <nav class="categorias" th:unless="${#maps.isEmpty(categorias)}">
    <a th:each="e, st : ${categorias}" th:href="'#cat-' + ${st.index}" th:text="${e.key}"></a>
    </nav>
    <a th:if="${ultimoPedidoId != null}"
   th:href="@{/pedido/{id}/confirmado(id=${ultimoPedidoId})}">📦 Acompanhar meu pedido</a>
    <form th:action="@{/carrinho/adicionar-varios}" method="post">
        <div class="lista">

            <h2>🍔 Comidas</h2>
            <p class="vazio" th:if="${#maps.isEmpty(categorias)}">Nenhum produto cadastrado.</p>

        <th:block th:each="e, st : ${categorias}">

            <h2 th:id="'cat-' + ${st.index}">
        <span th:switch="${e.key}">
            <span th:case="'Hambúrguer'">🍔</span>
            <span th:case="'Acompanhamento'">🍟</span>
            <span th:case="'Bebida'">🥤</span>
            <span th:case="'Sobremesa'">🍰</span>
            <span th:case="*">🍽️</span>
        </span>
        <span th:text="${e.key}"></span>
        </h2>

        <div class="item" th:each="p : ${e.value}">
        <div>
            <div class="nome" th:text="${p.nome}"></div>
            <div class="desc" th:text="${p.descricao}"></div>
            <div class="preco"
                 th:if="${p.precoM == null and p.precoG == null}"
                 th:text="${p.preco != null} ? 'R$ ' + ${#numbers.formatDecimal(p.preco, 1, 'POINT', 2, 'COMMA')} : ''"></div>
        </div>
        <div class="qtd">
            <select th:name="'tam_' + ${p.id}" th:if="${p.precoM != null or p.precoG != null}">
                <option value="P" th:text="'P - R$ ' + ${#numbers.formatDecimal(p.preco, 1, 'POINT', 2, 'COMMA')}"></option>
                <option value="M" th:if="${p.precoM != null}"
                        th:text="'M - R$ ' + ${#numbers.formatDecimal(p.precoM, 1, 'POINT', 2, 'COMMA')}"></option>
                <option value="G" th:if="${p.precoG != null}"
                        th:text="'G - R$ ' + ${#numbers.formatDecimal(p.precoG, 1, 'POINT', 2, 'COMMA')}"></option>
            </select>
            <button type="button" onclick="mudar(this, -1)">-</button>
            <input type="number" th:name="'qtd_' + ${p.id}" value="0" min="0" max="20">
            <button type="button" onclick="mudar(this, 1)">+</button>
        </div>
    </div>

</th:block>

        </div>

        <div class="barra">
            <button type="submit">Adicionar selecionados ao carrinho</button>
        </div>
    </form>

    <script>
        function mudar(botao, delta) {
            var campo = botao.parentElement.querySelector('input');
            var novo = (parseInt(campo.value) || 0) + delta;
            if (novo < 0) novo = 0;
            if (novo > 20) novo = 20;
            campo.value = novo;
        }
    </script>
</body>
</html>

spring.application.name=lanchonete

spring.datasource.url=jdbc:mysql://localhost:3306/lanchonete?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

app.admin.usuario=admin
app.admin.senha=${ADMIN_SENHA:admin123}

app.uploads.dir=src/main/resources/static/img
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB
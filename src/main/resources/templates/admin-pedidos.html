<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Pedidos - Administração</title>
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <th:block th:replace="~{fragments/admin :: estilo}"></th:block>
    <link rel="stylesheet" th:href="@{/css/admin-pedidos.css}">
</head>
<body>
    <header th:replace="~{fragments/admin :: menu('pedidos')}"></header>

    <main class="pagina kanban-pagina">
        <p class="dica-kanban">Arraste os cartões entre as colunas para atualizar o status do pedido.</p>

        <div class="kanban">
            <section class="coluna" th:each="col : ${colunas}" th:classappend="'col-' + ${col.key.name()}">
                <header class="coluna-topo">
                    <h3 th:text="${col.key.descricao}"></h3>
                    <span class="contagem" th:text="${#lists.size(col.value)}">0</span>
                </header>

                <div class="coluna-corpo" th:data-status="${col.key.name()}">

                    <article class="cartao-pedido" draggable="true"
                             th:each="p : ${col.value}" th:data-id="${p.id}">

                        <div class="cp-topo">
                            <strong th:text="'#' + ${p.id}"></strong>
                            <span class="hora" th:text="${#temporals.format(p.criadoEm, 'dd/MM HH:mm')}"></span>
                        </div>

                        <div class="cp-cliente">
                            <strong th:text="${p.nomeCliente}"></strong>
                            <span th:text="${p.telefone}"></span>
                        </div>

                        <span class="tipo" th:classappend="${p.entrega} ? 'tipo-entrega' : 'tipo-retirada'"
                              th:text="${p.entrega} ? '🛵 Entrega' : '🏪 Retirar no local'"></span>

                        <p class="cp-endereco" th:if="${p.entrega}"
                           th:text="${p.rua} + ', ' + ${p.numero} + (${p.complemento} != null ? ' - ' + ${p.complemento} : '') + ' · ' + ${p.bairro} + ' · ' + ${p.cidade}"></p>

                        <ul class="cp-itens">
                            <li th:each="i : ${p.itens}">
                                <span th:text="${i.quantidade} + 'x ' + ${i.nomeProduto}"></span>
                                <strong th:if="${i.tamanho != 'U'}" th:text="'(' + ${i.tamanho} + ')'"></strong>
                            </li>
                        </ul>

                        <p class="cp-obs" th:if="${p.observacoes != null}" th:text="'📝 ' + ${p.observacoes}"></p>

                        <div class="cp-total"
                             th:text="'R$ ' + ${#numbers.formatDecimal(p.total, 1, 'POINT', 2, 'COMMA')}"></div>
                    </article>

                </div>
            </section>
        </div>
    </main>

    <div id="toast" class="toast"></div>

    <script>
        var token  = document.querySelector('meta[name="_csrf"]').content;
        var header = document.querySelector('meta[name="_csrf_header"]').content;
        var arrastado = null;
        var origem = null;

        function toast(msg) {
            var t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('mostrar');
            setTimeout(function () { t.classList.remove('mostrar'); }, 2500);
        }

        function atualizarContagens() {
            document.querySelectorAll('.coluna').forEach(function (col) {
                col.querySelector('.contagem').textContent =
                    col.querySelectorAll('.cartao-pedido').length;
            });
        }

        document.querySelectorAll('.cartao-pedido').forEach(function (c) {
            c.addEventListener('dragstart', function (e) {
                arrastado = c;
                origem = c.parentElement;
                c.classList.add('arrastando');
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', c.dataset.id);
            });
            c.addEventListener('dragend', function () {
                c.classList.remove('arrastando');
                arrastado = null;
                document.querySelectorAll('.coluna').forEach(function (col) { col.classList.remove('alvo'); });
            });
        });

        document.querySelectorAll('.coluna-corpo').forEach(function (corpo) {
            var coluna = corpo.parentElement;

            corpo.addEventListener('dragover', function (e) {
                e.preventDefault();
                coluna.classList.add('alvo');
            });
            corpo.addEventListener('dragleave', function (e) {
                if (!corpo.contains(e.relatedTarget)) coluna.classList.remove('alvo');
            });
            corpo.addEventListener('drop', function (e) {
                e.preventDefault();
                coluna.classList.remove('alvo');
                if (!arrastado || corpo === origem) return;

                var cartao = arrastado;
                var voltarPara = origem;

                // move na tela já, e desfaz se o servidor recusar
                corpo.prepend(cartao);
                atualizarContagens();

                var headers = { 'Content-Type': 'application/x-www-form-urlencoded' };
                headers[header] = token;

                fetch('/admin/pedidos/' + cartao.dataset.id + '/mover', {
                    method: 'POST',
                    headers: headers,
                    body: new URLSearchParams({ status: corpo.dataset.status })
                })
                .then(function (r) { if (!r.ok) throw new Error('falha'); })
                .catch(function () {
                    voltarPara.prepend(cartao);
                    atualizarContagens();
                    toast('Não foi possível atualizar o pedido. Tente novamente.');
                });
            });
        });

        // novos pedidos aparecem sozinhos, sem interromper um arraste
        setInterval(function () {
            if (!arrastado && !document.hidden) location.reload();
        }, 30000);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="estilo">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
    <header th:fragment="menu(ativa)" class="topo">
        <h1>🍔 Painel da Lanchonete</h1>
        <nav class="abas">
            <a th:href="@{/admin/produtos}" th:classappend="${ativa == 'produtos'} ? 'ativa'">Produtos</a>
            <a th:href="@{/admin/pedidos}" th:classappend="${ativa == 'pedidos'} ? 'ativa'">Pedidos</a>
            <a th:href="@{/cardapio}" target="_blank">Ver cardápio ↗</a>
            <form th:action="@{/logout}" method="post" style="display:inline; margin:0">
                <button type="submit" style="background:none; border:0; color:#fff; font-weight:600;
                        cursor:pointer; padding:8px 16px; opacity:.8; font-size:inherit">Sair</button>
            </form>
        </nav>
    </header>
</body>
</html>

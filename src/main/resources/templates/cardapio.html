<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cardápio - Administração</title>
</head>
<body>
    <h1>Cardápio</h1>

    <form th:action="@{/admin/produtos}" method="get">
        <input type="text" name="busca" placeholder="Buscar por nome">
        <button type="submit">Buscar</button>
    </form>
    <a th:href="@{/admin/produtos/novo}">Novo produto</a>
    <br><br>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Descrição</th>
                <th>Preço</th>
                <th>Categoria</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="produto : ${produtos}">
                <td th:text="${produto.id}"></td>
                <td th:text="${produto.nome}"></td>
                <td th:text="${produto.descricao}"></td>
                <td th:text="${#numbers.formatDecimal(produto.preco, 1, 'POINT', 2, 'COMMA')}"></td>
                <td th:text="${produto.categoria}"></td>
                <td>
                    <a th:href="@{/admin/produtos/editar/{id}(id=${produto.id})}">Editar</a>
                    <form th:action="@{/admin/produtos/excluir/{id}(id=${produto.id})}" method="post" style="display:inline">
                        <button type="submit">Excluir</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>

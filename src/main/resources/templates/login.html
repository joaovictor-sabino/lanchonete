<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
    <main class="login-box">
        <h1>🍔 Entrar</h1>
        <p class="erro" th:if="${param.error}">Usuário ou senha inválidos.</p>
        <p class="ok" th:if="${param.cadastrado}">Conta criada! Entre para continuar.</p>
        <form th:action="@{/login}" method="post">
            <label for="username">Usuário</label>
            <input type="text" id="username" name="username" required autofocus>

            <label for="password">Senha</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Entrar</button>
        </form>
        <p class="alt">Não tem conta? <a th:href="@{/cadastro}">Criar conta</a></p>
        <a class="voltar" th:href="@{/cardapio}">← Voltar ao cardápio</a>
    </main>
</body>
</html>

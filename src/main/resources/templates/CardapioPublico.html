<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cardápio</title>
    <style>
        body { font-family: Arial, sans-serif; background: #fff8f0; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #b53a00; }
        .lista { max-width: 800px; margin: 0 auto; }
        .item { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 12px;
                box-shadow: 0 2px 6px rgba(0,0,0,.1); display: flex; justify-content: space-between; }
        .nome { font-weight: bold; font-size: 18px; }
        .desc { color: #666; margin-top: 4px; }
        .preco { color: #b53a00; font-weight: bold; font-size: 18px; white-space: nowrap; }
        .cat { font-size: 12px; color: #999; text-transform: uppercase; }
    </style>
</head>
<body>
    <h1>🍔 Nosso Cardápio</h1>
    <div class="lista">
        <div class="item" th:each="produto : ${produtos}">
            <div>
                <div class="cat" th:text="${produto.categoria}"></div>
                <div class="nome" th:text="${produto.nome}"></div>
                <div class="desc" th:text="${produto.descricao}"></div>
            </div>
            <div class="preco" th:text="'R$ ' + ${#numbers.formatDecimal(produto.preco, 1, 'POINT', 2, 'COMMA')}"></div>
        </div>
    </div>
</body>
</html>

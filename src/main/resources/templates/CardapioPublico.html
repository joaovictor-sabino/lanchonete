<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cardápio</title>
    <style>
        body { font-family: Arial, sans-serif; background: #fff8f0; margin: 0; padding: 20px 20px 100px; }
        h1 { text-align: center; color: #b53a00; }
        h2 { color: #b53a00; border-bottom: 2px solid #b53a00; padding-bottom: 4px; }
        .lista { max-width: 800px; margin: 0 auto; }
        .item { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 12px;
                box-shadow: 0 2px 6px rgba(0,0,0,.1); display: flex;
                justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
        .nome { font-weight: bold; font-size: 18px; }
        .desc { color: #666; margin-top: 4px; }
        .preco { color: #b53a00; font-weight: bold; font-size: 18px; margin-top: 4px; }
        .qtd { display: flex; align-items: center; gap: 6px; }
        .qtd button { width: 36px; height: 36px; border: 0; border-radius: 6px; background: #b53a00;
                      color: #fff; font-size: 20px; cursor: pointer; }
        .qtd input { width: 50px; padding: 6px; font-size: 16px; text-align: center; }
        .barra { position: fixed; bottom: 0; left: 0; right: 0; background: #fff;
                 box-shadow: 0 -2px 8px rgba(0,0,0,.15); padding: 12px; text-align: center; }
        .barra button { background: #b53a00; color: #fff; border: 0; padding: 12px 24px;
                        border-radius: 8px; font-size: 18px; cursor: pointer; }
        .carrinho { position: fixed; top: 16px; right: 16px; background: #b53a00; color: #fff;
                    padding: 10px 16px; border-radius: 20px; text-decoration: none; font-weight: bold; }
        .vazio { color: #999; font-style: italic; }
        html { scroll-behavior: smooth; }
        .categorias { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin: 0 auto 24px; max-width: 800px; }
        .categorias a { background: #fff; color: #b53a00; border: 2px solid #b53a00; padding: 8px 16px;
                        border-radius: 20px; text-decoration: none; font-weight: bold; }
        .categorias a:hover { background: #b53a00; color: #fff; }
        h2 { margin-top: 32px; }
        .qtd { flex-wrap: wrap; justify-content: flex-end; }
        .tamanhos { display: flex; gap: 6px; margin-right: 8px; }
        .tamanhos label { position: relative; cursor: pointer; }
        .tamanhos input { position: absolute; opacity: 0; pointer-events: none; }
        .tamanhos span { display: block; padding: 6px 14px; border: 2px solid #e0d6cd; border-radius: 20px;
                        background: #fff; font-weight: bold; color: #666; text-align: center; line-height: 1.2; }
        .tamanhos small { display: block; font-weight: normal; font-size: 12px; }
        .tamanhos label:hover span { border-color: #b53a00; }
        .tamanhos input:checked + span { background: #b53a00; border-color: #b53a00; color: #fff; }
        .tamanhos input:focus-visible + span { outline: 3px solid rgba(181, 58, 0, .35); }
        /* Texto do produto ocupa o espaço restante e quebra linha; controles ficam sempre à direita */
        .item { flex-wrap: nowrap; align-items: center; }
        .item > div:first-child { flex: 1 1 0; min-width: 0; overflow-wrap: anywhere; }
        .item .qtd { flex: 0 0 auto; }

        /* Em telas pequenas não cabe tudo na mesma linha: controles descem, alinhados à direita */
        @media (max-width: 600px) {
            .item { flex-wrap: wrap; }
            .item > div:first-child { flex-basis: 100%; }
            .item .qtd { width: 100%; justify-content: flex-end; }

            .carrinho { z-index: 30; }
            .carrinho.bump { animation: bump .5s ease; }
            @keyframes bump {
                0%   { transform: scale(1); }
                30%  { transform: scale(1.25); }
                60%  { transform: scale(.95); }
                100% { transform: scale(1); }
            }

            #contador { display: inline-block; min-width: 1ch; text-align: center; }
            #contador.pulo { animation: pulo .4s ease; }
            @keyframes pulo {
                0%   { transform: translateY(0); }
                40%  { transform: translateY(-6px); }
                100% { transform: translateY(0); }
            }

            /* "+N" que sobe a partir do carrinho */
            .mais-n { position: fixed; top: 62px; right: 28px; z-index: 31; pointer-events: none;
                    background: #2e7d32; color: #fff; font-weight: bold; padding: 3px 10px; border-radius: 12px;
                    animation: subir 1s ease forwards; }
            @keyframes subir {
                0%   { opacity: 0; transform: translateY(10px); }
                20%  { opacity: 1; }
                100% { opacity: 0; transform: translateY(-26px); }
            }

            /* aviso inferior */
            .toast { position: fixed; left: 50%; bottom: 84px; transform: translate(-50%, 20px); opacity: 0;
                    background: #2e7d32; color: #fff; padding: 10px 20px; border-radius: 24px; font-weight: bold;
                    box-shadow: 0 4px 12px rgba(0,0,0,.25); transition: opacity .25s, transform .25s;
                    pointer-events: none; z-index: 40; max-width: 90%; text-align: center; }
            .toast.mostrar { opacity: 1; transform: translate(-50%, 0); }
            .toast.erro { background: #b00020; }

            .barra button:disabled { opacity: .6; cursor: wait; }

            @media (prefers-reduced-motion: reduce) {
                .carrinho.bump, #contador.pulo, .mais-n { animation: none; }
            }
}
    </style>
</head>
<body>
    <a class="carrinho" id="pillCarrinho" th:href="@{/carrinho}">🛒 Carrinho (<span id="contador" th:text="${totalItens}">0</span>)</a>

    <h1>🍔 Nosso Cardápio</h1>
    <nav class="categorias" th:unless="${#maps.isEmpty(categorias)}">
    <a th:each="e, st : ${categorias}" th:href="'#cat-' + ${st.index}" th:text="${e.key}"></a>
    </nav>
    <a th:if="${ultimoPedidoId != null}"
   th:href="@{/pedido/{id}/confirmado(id=${ultimoPedidoId})}">📦 Acompanhar meu pedido</a>
    <form id="formCardapio"
            th:action="@{/carrinho/adicionar-varios}"
            th:data-ajax="@{/carrinho/adicionar-ajax}"
            method="post">
   
        <div class="lista">

            <h2 th:unless="${#lists.isEmpty(comidas)}">🍔 Comidas</h2>

        <th:block th:each="e, st : ${categorias}">

            <h2 th:id="'cat-' + ${st.index}">
        <span th:switch="${e.key}">
            <span th:case="'Hambúrguer'">🍔</span>
            <span th:case="'Acompanhamento'">🍟</span>
            <span th:case="'Bebida'">🥤</span>
            <span th:case="'Sobremesa'">🍰</span>
            <span th:case="*">🍽️</span>
        </span>
        <span th:text="${e.key}"></span>
        </h2>

        <div class="item" th:each="p : ${e.value}">
        <div>
            <div class="nome" th:text="${p.nome}"></div>
            <div class="desc" th:text="${p.descricao}"></div>
            <div class="preco"
                 th:if="${p.precoM == null and p.precoG == null}"
                 th:text="${p.preco != null} ? 'R$ ' + ${#numbers.formatDecimal(p.preco, 1, 'POINT', 2, 'COMMA')} : ''"></div>
        </div>
        <div class="qtd">
            <div class="tamanhos" th:if="${p.precoM != null or p.precoG != null}">
            <label>
                <input type="radio" th:name="'tam_' + ${p.id}" value="P" checked>
                <span>P<small th:text="'R$ ' + ${#numbers.formatDecimal(p.preco, 1, 'POINT', 2, 'COMMA')}"></small></span>
            </label>
            <label th:if="${p.precoM != null}">
                <input type="radio" th:name="'tam_' + ${p.id}" value="M">
                <span>M<small th:text="'R$ ' + ${#numbers.formatDecimal(p.precoM, 1, 'POINT', 2, 'COMMA')}"></small></span>
            </label>
            <label th:if="${p.precoG != null}">
                <input type="radio" th:name="'tam_' + ${p.id}" value="G">
                <span>G<small th:text="'R$ ' + ${#numbers.formatDecimal(p.precoG, 1, 'POINT', 2, 'COMMA')}"></small></span>
            </label>
        </div>
            <button type="button" onclick="mudar(this, -1)">-</button>
            <input type="number" th:name="'qtd_' + ${p.id}" value="0" min="0" max="20">
            <button type="button" onclick="mudar(this, 1)">+</button>
        </div>
    </div>

</th:block>

        </div>

        <div class="barra">
            <button type="submit" id="btnAdicionar">Adicionar selecionados ao carrinho</button>
        </div>

        
    </form>

    <div id="toast" class="toast"></div>

    <script>
        function mudar(botao, delta) {
        var campo = botao.parentElement.querySelector('input[type="number"]');
        var novo = (parseInt(campo.value) || 0) + delta;
        if (novo < 0) novo = 0;
        if (novo > 20) novo = 20;
        campo.value = novo;
    }

    //ANIMAÇÃO CARRINHO
    var form = document.getElementById('formCardapio');
var contadorEl = document.getElementById('contador');
var pill = document.getElementById('pillCarrinho');
var botaoAdd = document.getElementById('btnAdicionar');
var toastEl = document.getElementById('toast');
var toastTimer;

function toast(msg, erro) {
    toastEl.textContent = msg;
    toastEl.classList.toggle('erro', !!erro);
    toastEl.classList.add('mostrar');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('mostrar'); }, 2200);
}

// reinicia uma animação CSS mesmo que ela já tenha rodado antes
function reiniciar(el, classe) {
    el.classList.remove(classe);
    void el.offsetWidth;
    el.classList.add(classe);
}

// o número "rola" do valor antigo até o novo
function animarContador(de, para) {
    var reduzir = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduzir || de === para) { contadorEl.textContent = para; return; }
    var inicio = null, duracao = 500;
    function passo(t) {
        if (inicio === null) inicio = t;
        var p = Math.min((t - inicio) / duracao, 1);
        contadorEl.textContent = Math.round(de + (para - de) * p);
        if (p < 1) requestAnimationFrame(passo);
    }
    requestAnimationFrame(passo);
}

function mostrarMais(n) {
    var el = document.createElement('div');
    el.className = 'mais-n';
    el.textContent = '+' + n;
    document.body.appendChild(el);
    setTimeout(function () { el.remove(); }, 1000);
}

form.addEventListener('submit', function (e) {
    e.preventDefault(); // não sai da página

    var soma = 0;
    form.querySelectorAll('input[type="number"]').forEach(function (i) {
        soma += parseInt(i.value) || 0;
    });
    if (soma < 1) {
        toast('Escolha a quantidade de pelo menos um item.', true);
        return;
    }

    var textoOriginal = botaoAdd.textContent;
    botaoAdd.disabled = true;
    botaoAdd.textContent = 'Adicionando...';

    fetch(form.dataset.ajax, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams(new FormData(form))
    })
    .then(function (r) {
        if (!r.ok) throw new Error('falha');
        return r.json();
    })
    .then(function (d) {
        var antes = parseInt(contadorEl.textContent) || 0;
        animarContador(antes, d.totalItens);
        reiniciar(pill, 'bump');
        reiniciar(contadorEl, 'pulo');
        mostrarMais(d.adicionados);

        // zera as quantidades para não adicionar de novo ao clicar outra vez
        form.querySelectorAll('input[type="number"]').forEach(function (i) { i.value = 0; });

        toast(d.adicionados + (d.adicionados === 1 ? ' item adicionado' : ' itens adicionados') + ' ao carrinho ✓');
    })
    .catch(function () {
        toast('Não foi possível adicionar. Tente novamente.', true);
    })
    .finally(function () {
        botaoAdd.disabled = false;
        botaoAdd.textContent = textoOriginal;
    });
});
    </script>
</body>
</html>
